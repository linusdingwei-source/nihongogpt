edition: 3.0.0
name: nihongogpt-project
access: default

resources:
  nihongogpt_app:
    component: fc3
    props:
      region: cn-hongkong
      functionName: nihongogpt-web
      description: 'Next.js standalone app on FC 3.0'
      runtime: custom-container
      # 确保 customContainerConfig 对齐
      customContainerConfig:
        image: docker.io/nihongogpt/nihongogpt:latest
        port: 3000
      # 确保以下配置与 customContainerConfig 对齐（同级）
      diskSize: 512
      cpu: 1.0
      memorySize: 2048
      timeout: 60
      internetAccess: true
      environmentVariables:
        NODE_ENV: production
        DATABASE_URL: ${env.DATABASE_URL}
        AUTH_SECRET: ${env.AUTH_SECRET}
        AUTH_TRUST_HOST: "true"
        NEXTAUTH_URL: ${env.NEXTAUTH_URL}
        GOOGLE_CLIENT_ID: ${env.GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${env.GOOGLE_CLIENT_SECRET}
        STRIPE_SECRET_KEY: ${env.STRIPE_SECRET_KEY}
        STRIPE_WEBHOOK_SECRET: ${env.STRIPE_WEBHOOK_SECRET}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: [GET, POST, PUT, DELETE, OPTIONS]
