edition: 3.0.0
name: nihongogpt-project
access: default

resources:
  nihongogpt_app:
    component: fc3
    props:
      region: cn-hongkong
      functionName: nihongogpt-web
      description: 'Next.js standalone app on FC 3.0'
      runtime: custom-container
      # 确保 customContainerConfig 对齐
      customContainerConfig:
        image: docker.io/nihongogpt/nihongogpt:latest
        port: 3000
      # 确保以下配置与 customContainerConfig 对齐（同级）
      diskSize: 512
      cpu: 1.0
      memorySize: 2048
      timeout: 60
      internetAccess: true
      vpcConfig:
        vpcId: vpc-j6cgcrkpbxsml1mgv4sfr
        securityGroupId: sg-j6c37y400u8b5zzof3hy
        vSwitchIds:
          - vsw-j6cblkntpbbnv3p6kmjgb
      environmentVariables:
        NODE_ENV: production
        DATABASE_URL: ${env.DATABASE_URL}
        AUTH_SECRET: ${env.AUTH_SECRET}
        AUTH_TRUST_HOST: "true"
        NEXTAUTH_URL: ${env.NEXTAUTH_URL}
        GOOGLE_CLIENT_ID: ${env.GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${env.GOOGLE_CLIENT_SECRET}
        STRIPE_SECRET_KEY: ${env.STRIPE_SECRET_KEY}
        STRIPE_WEBHOOK_SECRET: ${env.STRIPE_WEBHOOK_SECRET}
        RESEND_API_KEY: ${env.RESEND_API_KEY}
        RESEND_FROM_EMAIL: ${env.RESEND_FROM_EMAIL}
        DASHSCOPE_API_KEY: ${env.DASHSCOPE_API_KEY}
        STORAGE_PROVIDER: ${env.STORAGE_PROVIDER}
        OSS_REGION: ${env.OSS_REGION}
        OSS_BUCKET: ${env.OSS_BUCKET}
        OSS_ACCESS_KEY_ID: ${env.OSS_ACCESS_KEY_ID}
        OSS_ACCESS_KEY_SECRET: ${env.OSS_ACCESS_KEY_SECRET}
        OSS_PREFIX: ${env.OSS_PREFIX}
        FREE_MODE: "${env.FREE_MODE}"
        NEXT_PUBLIC_FREE_MODE: "${env.NEXT_PUBLIC_FREE_MODE}"
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: [GET, POST, PUT, DELETE, OPTIONS]
