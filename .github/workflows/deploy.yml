name: Build and Deploy to Aliyun FC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # === Docker 构建部分 (保持不变) ===
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: nihongogpt/nihongogpt:latest
        cache-from: type=registry,ref=nihongogpt/nihongogpt:buildcache
        cache-to: type=registry,ref=nihongogpt/nihongogpt:buildcache,mode=max

    # === 部署部分 ===
    - name: Install Serverless Devs
      run: npm install -g @serverless-devs/s

    - name: Config Aliyun Credentials
      run: |
        s config add --AccessKeyID "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" --AccessKeySecret "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" --AccountID "${{ secrets.ALIYUN_ACCOUNT_ID }}" -a default -f

    # 🔥🔥🔥 核心大招：使用 Python 强行替换 s.yaml 中的变量 🔥🔥🔥
    # 这步运行完，s.yaml 里就全是真实的密码了，不存在 ${env.XXX} 了
    - name: Inject Secrets into s.yaml
      shell: python
      env:
        # 将 GitHub Secrets 传入 Python 环境
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      run: |
        import os
        import re
        
        print("🔄 Starting to replace variables in s.yaml...")
        
        # 读取 s.yaml
        with open('s.yaml', 'r') as f:
            content = f.read()
        
        # 定义替换函数：找到 ${env.XXX}，去环境变量里找对应的值并替换
        def replace_env(match):
            var_name = match.group(1) # 获取变量名，例如 DATABASE_URL
            value = os.environ.get(var_name)
            if value is None:
                print(f"⚠️ Warning: Secret {var_name} is not set in GitHub Secrets! Replacing with empty string.")
                return ""
            # 简单的转义，防止 YAML 格式破裂（如果密码里有特殊字符）
            # 注意：如果你的 s.yaml 里没有给变量加引号，这里直接替换值
            return value

        # 正则匹配 ${env.任何字母数字下划线}
        new_content = re.sub(r'\$\{env\.([A-Za-z0-9_]+)\}', replace_env, content)
        
        # 覆写回 s.yaml
        with open('s.yaml', 'w') as f:
            f.write(new_content)
            
        print("✅ s.yaml successfully patched with real secrets.")

    # 部署 (此时 s.yaml 已经是纯文本，无需任何 env 参数)
    - name: Deploy to FC
      run: s deploy -y --use-local