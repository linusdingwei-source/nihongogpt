name: Build and Deploy to Aliyun FC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 设置 Node.js 环境 (Serverless Devs 需要)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 2. 设置 Docker 环境 (用于构建镜像)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. 登录 Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. 构建并推送镜像
    # 注意：确保你的 Dockerfile 已经写好了
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: nihongogpt/nihongogpt:latest
        # 启用缓存，加快构建速度
        cache-from: type=registry,ref=nihongogpt/nihongogpt:buildcache
        cache-to: type=registry,ref=nihongogpt/nihongogpt:buildcache,mode=max

    # 5. 安装 Serverless Devs 工具
    - name: Install Serverless Devs
      run: npm install -g @serverless-devs/s

    # 6. 配置阿里云密钥
    # 使用 -f 强制覆盖旧配置，确保密钥最新
    - name: Config Aliyun Credentials
      run: |
        s config add --AccessKeyID "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" --AccessKeySecret "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" --AccountID "${{ secrets.ALIYUN_ACCOUNT_ID }}" -a default -f

    # 7. 部署到阿里云 FC
    # 关键点：使用 env 关键字将 GitHub Secrets 注入到环境变量中
    # 只有这样，s.yaml 中的 ${env.XXX} 才能读到值
    - name: Deploy to FC
      run: s deploy -y --use-local
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        # 如果你的 Stripe 密钥也在 Secrets 里，记得加在这里
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}