name: Build and Deploy to Aliyun FC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # === Docker 构建部分 ===
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: nihongogpt/nihongogpt:latest
        cache-from: type=registry,ref=nihongogpt/nihongogpt:buildcache
        cache-to: type=registry,ref=nihongogpt/nihongogpt:buildcache,mode=max

    # === Serverless Devs 部署部分 ===
    - name: Install Serverless Devs
      run: npm install -g @serverless-devs/s

    # 配置阿里云访问密钥 (使用 -f 强制覆盖旧配置)
    - name: Config Aliyun Credentials
      run: |
        s config add --AccessKeyID "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" --AccessKeySecret "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" --AccountID "${{ secrets.ALIYUN_ACCOUNT_ID }}" -a default -f

    # 🔴 核心修复步骤：部署并显式注入环境变量
    # 这里不需要生成 .env 文件，直接用 env 关键字最安全
    - name: Deploy to FC
      run: s deploy -y --use-local
      env:
        # 左边: 对应 s.yaml 里 ${env.XXX} 的名字
        # 右边: 对应 GitHub Secrets 里的名字
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        # 支付相关的密钥 (请确保 GitHub Secrets 里有这两个，否则填空值)
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}