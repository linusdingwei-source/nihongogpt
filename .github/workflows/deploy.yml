name: Build and Deploy to Aliyun FC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 1. 设置 Docker 环境
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 2. 登录 Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. 构建并推送镜像
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: nihongogpt/nihongogpt:latest
        cache-from: type=registry,ref=nihongogpt/nihongogpt:buildcache
        cache-to: type=registry,ref=nihongogpt/nihongogpt:buildcache,mode=max

    # 4. 安装 Serverless Devs 工具
    - name: Install Serverless Devs
      run: npm install -g @serverless-devs/s

    # 5. 配置阿里云密钥 (使用 -f 强制覆盖)
    - name: Config Aliyun Credentials
      run: |
        s config add --AccessKeyID "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" --AccessKeySecret "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" --AccountID "${{ secrets.ALIYUN_ACCOUNT_ID }}" -a default -f

    # 6. 【关键修复步骤】生成 .env 文件
    # s deploy 会自动读取这个文件，彻底解决 "not found" 问题
    - name: Create .env file
      run: |
        touch .env
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
        echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
        echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env
        echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
        echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
        # 注意：下面的 Stripe 密钥如果 Secrets 里没有，这里写入空值可能会报错
        # 请确保你在 GitHub Secrets 里配置了这两个变量，或者暂时注释掉 s.yaml 里的对应引用
        echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
        echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
        
        echo "✅ .env file created successfully"

    # 7. 部署到 FC
    # 此时不需要再写 env: ... 了，因为 s deploy 会读取上面的 .env 文件
    - name: Deploy to FC
      run: s deploy -y --use-local